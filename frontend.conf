server {
    listen 80;
    server_name localhost;

    # Serve static files (HTML, HLS video)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ $uri.html =404;
    }

    # Explicit rule for the admin page to ensure clean URLs work (with or without a trailing slash)
    location ~ ^/admin/?$ {
        root /usr/share/nginx/html;
        try_files /admin.html =404;
    }

    # Reverse Proxy for WebSocket (Viewers & Admin)
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Reverse Proxy for API requests (Admin Last Score)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /admin/last {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}