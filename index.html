<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sports Streaming Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #e6edf5;
            color: #333;
            padding: 30px 15px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 20px;
        }

        @media (max-width: 992px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* --- PHẦN BÊN TRÁI: PLAYER --- */
        .main-wrapper {
            background: #ffffff;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        #video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .match-info-bar {
            display: flex;
            align-items: center;
            margin-top: 15px;
            background: #f4f7fc;
            border-radius: 8px;
            overflow: hidden;
            height: 60px;
        }

        /* Badge Bình Luận Viên (Xéo) */
        .commentator-badge {
            background-color: #0062cc;
            height: 100%;
            padding: 0 30px 0 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            clip-path: polygon(0 0, 90% 0, 100% 100%, 0% 100%);
            color: white;
            min-width: 180px;
        }

        .commentator-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid white;
            background-color: #ccc;
            object-fit: cover;
        }

        .commentator-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .live-tag {
            background-color: #e50027;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 3px;
            display: inline-block;
            margin-bottom: 2px;
            width: fit-content;
        }

        .commentator-name {
            font-weight: bold;
            font-size: 15px;
            white-space: nowrap;
        }

        /* Chi tiết trận đấu */
        .match-title {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-size: 20px;
            font-weight: 700;
            color: #111;
        }

        .team-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .vs-badge {
            background-color: #e50027;
            color: white;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 16px;
        }

        /* Phần Trạng thái websocket cập nhật tỷ số */
        #status-bar {
            margin-top: 15px;
            padding: 12px;
            background: #222;
            color: #fff;
            border-radius: 8px;
            font-weight: 500;
            text-align: center;
        }

        /* --- PHẦN BÊN PHẢI: SIDEBAR --- */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .match-card {
            background: linear-gradient(135deg, #0f2444 0%, #1e4b8f 100%);
            border: 2px solid #00a8ff;
            border-radius: 12px;
            padding: 15px;
            position: relative;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 168, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 160px;
            overflow: hidden;
        }

        .card-live-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #e50027;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-live-tag::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: white;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        .card-matchup {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }

        .card-logo {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: white;
            padding: 2px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .card-vs {
            font-size: 22px;
            font-weight: 900;
            font-style: italic;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .card-commentator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 4px 12px 4px 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
        }

        .card-commentator img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Cột Trái: Player -->
        <div class="main-content">
            <div class="main-wrapper">
                <div id="video-container"></div>
                
                <div class="match-info-bar">
                    <div class="commentator-badge">
                        <img src="https://i.pravatar.cc/100?img=11" alt="BLV" class="commentator-avatar">
                        <div class="commentator-details">
                            <span class="live-tag">LIVE</span>
                            <span class="commentator-name">Commentator Sun</span>
                        </div>
                    </div>
                    
                    <div class="match-title">
                        <span id="teamA-name">Team Red</span>
                        <img src="https://flagcdn.com/w80/vn.png" alt="VN" class="team-logo">
                        <span class="vs-badge">VS</span>
                        <img src="https://flagcdn.com/w80/kr.png" alt="KR" class="team-logo">
                        <span id="teamB-name">Team Blue</span>
                    </div>
                </div>
            </div>

                    <!-- WebSocket status bar -->
                    <div id="status-bar">
                        Status: <span id="status" style="color:#aaa;">Waiting for events...</span>
                    </div>
        </div>

        <!-- Cột Phải: Sidebar Danh sách trận -->
        <div class="sidebar">
            <!-- Card 1 -->
            <div class="match-card">
                <div class="card-live-tag">LIVE</div>
                <div class="card-matchup">
                    <img src="https://flagcdn.com/w80/fr.png" alt="FR" class="card-logo">
                    <span class="card-vs">VS</span>
                    <img src="https://flagcdn.com/w80/dk.png" alt="DK" class="card-logo">
                </div>
                <div class="card-commentator">
                    <img src="https://i.pravatar.cc/100?img=12" alt="BLV">
                    BLV Dần
                </div>
            </div>

            <!-- Card 2 -->
            <div class="match-card">
                <div class="card-live-tag">LIVE</div>
                <div class="card-matchup">
                    <img src="https://flagcdn.com/w80/de.png" alt="DE" class="card-logo">
                    <span class="card-vs">VS</span>
                    <img src="https://flagcdn.com/w80/es.png" alt="ES" class="card-logo">
                </div>
                <div class="card-commentator">
                    <img src="https://i.pravatar.cc/100?img=13" alt="BLV">
                    BLV Trĩ
                </div>
            </div>
            
            <!-- Card 3 -->
            <div class="match-card">
                <div class="card-live-tag">LIVE</div>
                <div class="card-matchup">
                    <img src="https://flagcdn.com/w80/jp.png" alt="JP" class="card-logo">
                    <span class="card-vs">VS</span>
                    <img src="https://flagcdn.com/w80/sa.png" alt="SA" class="card-logo">
                </div>
                <div class="card-commentator">
                    <img src="https://i.pravatar.cc/100?img=14" alt="BLV">
                    BLV Mão
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION (Supports Port Forwarding & Tunnels)
        // ==========================================
        const host = globalThis.location.host; // Automatically gets domain + port
        const wsProtocol = globalThis.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const httpProtocol = globalThis.location.protocol === 'https:' ? 'https:' : 'http:';
        
        const apiHost = host;
        const videoSrc = `${httpProtocol}//${host}/hls/master.m3u8`;

        // ==========================================
        // PART 1: DOM INTERACTION & EVENT QUEUE
        // ==========================================
        const statusText = document.getElementById('status');
        let eventQueue = []; // Nơi chứa các sự kiện bàn thắng chờ đến giờ phát

        // Track whether we restored a last event from storage
        let restoredFromStorage = false;

        // Restore last score/event from localStorage so page reload doesn't reset it
        try {
            const raw = localStorage.getItem('livetiming_last_event');
            if (raw) {
                const last = JSON.parse(raw);
                if (last && last.event_timestamp) {
                    // show persisted score immediately
                    showScoreEvent(last);
                    restoredFromStorage = true;
                }
            }
        } catch (e) { console.log(e); }

        // If we didn't restore from localStorage, ask the backend for the last broadcasted score
        if (!restoredFromStorage) {
            (async () => {
                try {
                    const res = await fetch(`${httpProtocol}//${apiHost}/admin/last`);
                    if (res && res.ok) {
                        const data = await res.json();
                        if (data && data.event_timestamp) {
                            showScoreEvent(data);
                            restoredFromStorage = true;
                        }
                    }
                } catch (e) { /* ignore */ }
            })();
        }

        function showScoreEvent(data) {
            const action = (data.action || 'goal').toLowerCase();
            const timeLabel = `[${new Date(data.event_timestamp).toLocaleTimeString()}]`;

            if (action === 'reset') {
                statusText.innerText = `${timeLabel} Score reset to ${data.score}`;
                statusText.style.color = "#ffb000";
                return;
            }

            if (action === 'manual') {
                statusText.innerText = `${timeLabel} Score updated: ${data.team} | ${data.score}`;
                statusText.style.color = "#00d1ff";
                return;
            }

            statusText.innerText = `${timeLabel} GOAL! ${data.team} scored! Score: ${data.score}`;
            statusText.style.color = "#00ff00";
        }

        // ==========================================
        // PHẦN 2: CẤU HÌNH HLS.JS (VIDEO PLAYER)
        // ==========================================
        let hlsInstance = null;
        const video = document.createElement('video');
        video.id = 'video-player';
        video.controls = true;
        video.autoplay = true;
        video.muted = true;
        document.getElementById('video-container').appendChild(video);

        // Chrome/Firefox require hls.js to play m3u8
        if (Hls.isSupported()) {
            hlsInstance = new Hls({
                // Problem 1: Configured for Lowest Possible Latency in HLS
                liveSyncDurationCount: 2, 
                liveMaxLatencyDurationCount: 4, 
                maxLiveSyncPlaybackRate: 1.5 
            });
            hlsInstance.loadSource(videoSrc);
            hlsInstance.attachMedia(video);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                console.log("Video stream ready");
                video.play().catch(e => console.log(e));
            });
        } 
        // Dành cho Safari (hỗ trợ m3u8 mặc định)
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }

        // ==========================================
        // PHẦN 3: ĐỒNG BỘ HÓA (SYNCHRONIZATION LOGIC)
        // ==========================================
        
        // Vòng lặp đồng bộ: Chạy liên tục mỗi khi video nhích thêm 1 khung hình
        video.addEventListener('timeupdate', () => {
            if (eventQueue.length === 0) return;

            // Problem 4: True Frame-Accurate Sync using EXT-X-PROGRAM-DATE-TIME
            let currentVideoTimeMS = null;
            if (hlsInstance && hlsInstance.playingDate) {
                currentVideoTimeMS = hlsInstance.playingDate.getTime();
            } else {
                // Fallback for Safari/native player if metadata is missing
                currentVideoTimeMS = Date.now() - (10 * 1000);
            }

            for (let i = 0; i < eventQueue.length; i++) {
                let ev = eventQueue[i];
                if (currentVideoTimeMS >= ev.event_timestamp) {
                    showScoreEvent(ev);
                    eventQueue.splice(i, 1); // Lấy ra khỏi hàng đợi
                    i--; // Lùi index vì array bị thay đổi
                }
            }
        });

        // ==========================================
        // PART 4: WEBSOCKET
        // ==========================================
        const ws = new WebSocket(`${wsProtocol}//${apiHost}/ws`);

        ws.onopen = () => {
            console.log("Connected to WebSocket server");
            // If we restored a persisted score, avoid overwriting that status text.
            if (!restoredFromStorage) {
                statusText.innerText = "Connected to score server";
                statusText.style.color = "#b9f1d0";
            } else {
                // annotate reconnect without clearing the shown score
                try {
                    statusText.innerText = statusText.innerText + ' (reconnected)';
                } catch (e) {}
            }
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            console.log("Score event received:", data);

            if (!video.paused && video.currentTime > 0) {
                eventQueue.push(data);

                statusText.innerText = `[System] Referee reported ${data.team} scored. Waiting for video to sync to real-world time...`;
                statusText.style.color = "#ffa500";
            } else {
                // If video isn't running, show immediately
                    showScoreEvent(data);
            }

            // Persist last event so reload won't lose it
            try { localStorage.setItem('livetiming_last_event', JSON.stringify(data)); } catch (e) {}
        };

        ws.onclose = () => {
            statusText.innerText = "Lost connection to score server";
            statusText.style.color = "red";
        };

        // Live-reload socket: backend notifies when frontend files change
        try {
            const reloadWs = new WebSocket(`${wsProtocol}//${apiHost}/ws/reload`);
            const applyStylesFromHTML = async (htmlText) => {
                try {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, 'text/html');
                    const newStyles = Array.from(doc.querySelectorAll('style'));
                    const currStyles = Array.from(document.querySelectorAll('style'));

                    if (newStyles.length > 0) {
                        // Replace existing style blocks if counts match, otherwise overwrite head styles
                        if (currStyles.length === newStyles.length) {
                            for (let i = 0; i < newStyles.length; i++) {
                                currStyles[i].textContent = newStyles[i].textContent;
                            }
                        } else {
                            // remove old styles
                            currStyles.forEach(s => s.remove());
                            // append new styles
                            const head = document.head || document.getElementsByTagName('head')[0];
                            newStyles.forEach(ns => {
                                const el = document.createElement('style');
                                el.textContent = ns.textContent;
                                head.appendChild(el);
                            });
                        }
                        console.log('Applied CSS-only update from HTML');
                        return true;
                    }

                    // Also handle <link rel="stylesheet"> updates by cache-busting hrefs
                    const newLinks = Array.from(doc.querySelectorAll('link[rel="stylesheet"]'));
                    if (newLinks.length > 0) {
                        const currLinks = Array.from(document.querySelectorAll('link[rel="stylesheet"]'));
                        newLinks.forEach((nl) => {
                            const href = nl.getAttribute('href');
                            // attempt to find matching current link
                            const match = currLinks.find(cl => cl.getAttribute('href') && cl.getAttribute('href').includes(href));
                            if (match) {
                                const sep = match.href.indexOf('?') === -1 ? '?' : '&';
                                match.href = match.href.split('?')[0] + sep + 't=' + Date.now();
                            }
                        });
                        return true;
                    }
                } catch (e) { console.log('applyStylesFromHTML failed', e); }
                return false;
            };

            reloadWs.onmessage = async (ev) => {
                try {
                    const d = JSON.parse(ev.data);
                    if (d && d.type === 'reload') {
                        console.log('Reload event received —', d.path || 'unknown');
                        // If server provided path and it's a CSS file, try CSS-only update
                        if (d.path && (d.path.endsWith('.css') || d.path.endsWith('.scss'))) {
                            // try to fetch the CSS file and update or cache-bust link
                            const cssUrl = `/${d.path}`;
                            // find link tag matching
                            const link = Array.from(document.querySelectorAll('link[rel="stylesheet"]')).find(l => l.href && l.href.includes(d.path));
                            if (link) {
                                link.href = link.href.split('?')[0] + '?t=' + Date.now();
                                console.log('CSS link cache-busted:', link.href);
                                return;
                            }
                            // fallback: fetch and insert as <style>
                            try {
                                const r = await fetch(cssUrl);
                                if (r.ok) {
                                    const txt = await r.text();
                                    const el = document.createElement('style');
                                    el.textContent = txt;
                                    document.head.appendChild(el);
                                    console.log('Inserted fetched CSS as <style>');
                                    return;
                                }
                            } catch (e) {}
                        }

                        // If server provided a changed HTML file (index.html/admin.html) try to extract styles only
                        if (d.path && (d.path.endsWith('index.html') || d.path.endsWith('admin.html'))) {
                            try {
                                const r = await fetch(`/${d.path}`);
                                if (r.ok) {
                                    const txt = await r.text();
                                    const applied = await applyStylesFromHTML(txt);
                                    if (applied) return;
                                }
                            } catch (e) { console.log(e); }
                        }

                        // fallback to full reload
                        console.log('Falling back to full reload');
                        globalThis.location.reload();
                    }
                } catch (e) { console.log(e); }
            };
        } catch (e) {
            console.log('Reload socket not available', e);
        }
    </script>

</body>
</html>
