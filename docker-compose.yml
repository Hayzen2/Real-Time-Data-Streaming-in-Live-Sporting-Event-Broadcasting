services:

  redis:
    image: redis:alpine
    container_name: livetiming-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./livetiming-backend
    container_name: livetiming-backend
    ports:
      - "8000:8000"
    volumes:
      - ./:/srv/app:ro
    environment:
      - WATCH_ROOT=/srv/app
      - STREAM_KEY=${STREAM_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: livestream-frontend
    ports:
      - "3000:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./admin.html:/usr/share/nginx/html/admin.html:ro
      - ./hls:/usr/share/nginx/html/hls:ro
      - ./frontend.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
  
  # Transcoder: Listens for SRT on UDP 1935 and produces multi-bitrate HLS
  transcoder:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: livetiming-transcoder
    ports:
      - "1935:1935/udp"
    volumes:
      - ./hls:/var/www/hls
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: ["/scripts/run.sh"]
    environment:
      - INPUT_URL=srt://0.0.0.0:1935?mode=listener&streamid=${STREAM_KEY:-test}
      - OUTPUT_DIR=/var/www/hls
    restart: unless-stopped

  playit:
    image: ghcr.io/playit-cloud/playit-agent:0.17
    network_mode: host
    environment:
    - SECRET_KEY=${PLAYIT_SECRET_KEY}