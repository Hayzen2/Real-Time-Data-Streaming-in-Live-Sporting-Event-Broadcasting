services:
  rtmp-server:
    image: tiangolo/nginx-rtmp
    container_name: nginx-rtmp
    ports:
      - "1935:1935" # Port nhận luồng RTMP từ OBS
      - "8080:80"   # Port HTTP xuất luồng HLS cho Client
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped

  backend:
    build:
      context: ./livetiming-backend
    container_name: livetiming-backend
    ports:
      - "8000:8000"
    restart: unless-stopped